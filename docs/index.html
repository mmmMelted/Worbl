<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#272335">
<meta name="description" content="Play Worbl in your browser. Drop marbles, collect powerful letters, and build words. An early playtest for feedback.">
<title>Worbl · Safari playtest</title>
<style>
@font-face{font-family:WorblDisplay;src:url("web-assets/display.ttf") format("truetype");font-display:swap;font-weight:100 900}
@font-face{font-family:WorblBody;src:url("web-assets/body.ttf") format("truetype");font-display:swap;font-weight:100 900}
:root{color-scheme:dark;font-family:WorblBody,sans-serif;background:#272335;color:#f5e8cf}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
::selection{background:#7ed5c7;color:#202130}
#frame{position:fixed;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);overflow:hidden}
canvas{display:block;width:100%;height:100%;outline:none;touch-action:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;padding:28px;background:#272335;z-index:2;overflow:auto}
.launch{width:min(100%,720px)}
.intro{display:grid;grid-template-columns:1fr 210px;align-items:center;gap:24px}
.mark{font-family:WorblDisplay,sans-serif;font-size:100px;font-weight:650;line-height:1;margin:0 0 16px;letter-spacing:-.02em;color:#f5e8cf}
.tagline{font-size:23px;font-weight:750;line-height:1.3;color:#7ed5c7;margin:0 0 20px}
.companion{display:block;width:100%;height:auto}
p{line-height:1.5;color:#d0c4d9;font-size:17px;margin:12px 0}
button{font-family:WorblDisplay,sans-serif;font-size:26px;font-weight:650;border:0;border-bottom:4px solid #b97936;background:#f3bb55;color:#202130;border-radius:12px;min-height:68px;width:100%;cursor:pointer;margin:24px 0 4px;transition:background .15s}button:hover{background:#ffd080}button:active{background:#dfa441;border-bottom-width:1px}button:disabled{opacity:.65;cursor:wait}button:focus-visible,a:focus-visible{outline:3px solid #7ed5c7;outline-offset:5px}a{color:#7ed5c7;text-underline-offset:4px}progress{appearance:none;width:100%;height:8px;border:0;border-radius:4px;overflow:hidden;background:#51445e;margin:16px 0 0}progress::-webkit-progress-bar{background:#51445e}progress::-webkit-progress-value{background:#7ed5c7}progress::-moz-progress-bar{background:#7ed5c7}.small{font-size:14px}.foot{display:flex;justify-content:space-between;gap:24px;margin-top:24px;padding-top:18px;border-top:1px solid #63566e}.foot p{margin:0}.hidden{display:none!important}
@media(max-width:560px){#loading{padding:28px 24px}.intro{grid-template-columns:1fr 110px;gap:6px}.mark{font-size:clamp(52px,14vw,80px)}.tagline{font-size:19px}.intro p{font-size:16px}.foot{gap:16px}.small{font-size:13px}}
@media(max-width:360px){.intro{grid-template-columns:1fr}.companion{display:none}.intro>div{min-width:0}.mark{font-size:64px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="worbl-web4.icon.png" />
<link rel="apple-touch-icon" href="worbl-web4.apple-touch-icon.png"/>

</head>
<body>
<div id="frame"><canvas id="canvas" tabindex="0" aria-label="Worbl game"></canvas>
<section id="loading" aria-label="Start Worbl"><div class="launch">
<div class="intro"><div><h1 class="mark">WORBL</h1><p class="tagline">A good bounce.<br>A better word.</p><p>Drop marbles. Collect letters.<br>Build your best word.</p></div><img class="companion" src="web-assets/companion.png" width="210" height="226" alt="Worbl's orange, wide-eyed companion"></div>
<button id="play" type="button">Open Worbl</button>
<progress id="progress" class="hidden" aria-label="Loading game"></progress>
<p id="status" aria-live="polite">Best played upright on your iPhone.</p>
<p class="small">Progress saves in this browser. Private browsing or clearing website data may remove it.</p>
<div class="foot"><p class="small">Playtest 0.2.3-web.4</p><a class="small" href="https://github.com/mmmMelted/Worbl/issues/new/choose" target="_blank" rel="noopener">Share feedback</a></div>
</div></section></div>
<noscript>Enable JavaScript to play Worbl.</noscript>
<script src="worbl-web4.js"></script>
<script>
'use strict';
const config={"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"worbl-web4","experimentalVK":false,"fileSizes":{"worbl-web4.pck":7500872,"worbl-web4.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
config.canvasResizePolicy=0;
const canvas=document.getElementById('canvas');
const frame=document.getElementById('frame');
const overlay=document.getElementById('loading');
const play=document.getElementById('play');
const status=document.getElementById('status');
const progress=document.getElementById('progress');
let running=false;
function fitCanvas(){
 const rect=frame.getBoundingClientRect();
 const pixelRatio=Math.min(window.devicePixelRatio||1,1.5);
 const width=Math.max(1,Math.round(rect.width*pixelRatio));
 const height=Math.max(1,Math.round(rect.height*pixelRatio));
 if(canvas.width!==width)canvas.width=width;
 if(canvas.height!==height)canvas.height=height;
}
new ResizeObserver(fitCanvas).observe(frame);
window.addEventListener('resize',fitCanvas);
if(window.visualViewport)window.visualViewport.addEventListener('resize',fitCanvas);
fitCanvas();
const engine=new Engine(config);
function fail(error){
 console.error(error);
 overlay.classList.remove('hidden');progress.classList.add('hidden');
 status.textContent='The game could not start. Try reloading this page in an up-to-date Safari tab. If it keeps happening, tell us your iPhone model and iOS version. '+(error?.message||'');
 play.textContent='Reload and try again';play.disabled=false;
 play.onclick=()=>location.reload();
}
play.onclick=async()=>{
 play.disabled=true;play.textContent='Loading…';progress.classList.remove('hidden');
 status.textContent='Loading Worbl. This can take a moment on the first visit.';
 try{
  const missing=Engine.getMissingFeatures({threads:false});
  if(missing.length)throw new Error('Browser support needed: '+missing.join(', '));
  fitCanvas();
  await engine.startGame({canvas,onProgress:(current,total)=>{
   if(total>0){progress.max=total;progress.value=current;status.textContent='Loading Worbl · '+Math.round(current/total*100)+'%';}
  }});
  running=true;overlay.classList.add('hidden');canvas.focus();
 }catch(error){fail(error);}
};
window.addEventListener('error',event=>{if(!running)fail(event.error||new Error(event.message));});
</script>
</body></html>
